Builds:
  - versionName: 0.3.1
    versionCode: 4
    commit: v0.3.1
    output: out/ztrackpad-lite-unsigned.apk
    scanignore:
      - libs/androidx-annotation.jar
    build: TARGET_SDK=33 SKIP_SIGN=1 ./build.sh

MaintainerNotes: |-
  Hand-rolled build: ./build.sh runs aapt2 -> javac -> d8 -> zip -> apksigner, so this
  recipe only supplies the platform. The F-Droid buildserver's SDK tops out at android-33,
  hence TARGET_SDK=33; the tree compiles against it unchanged while the GitHub release
  targets 36. SKIP_SIGN=1 leaves out/ztrackpad-lite-unsigned.apk for F-Droid to sign.
  libs/androidx-annotation.jar is the vendored Apache-2.0 annotation jar from Maven Central;
  build.sh treats libs/*.jar as compile inputs, and no source file references it, so it is
  scanignored here and due to be dropped from the tree in the next release.

