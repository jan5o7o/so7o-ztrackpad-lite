    build: TARGET_SDK=33 SKIP_SIGN=1 ./build.sh

MaintainerNotes: |-
  Hand-rolled build: ./build.sh runs aapt2 -> javac -> d8 -> zip -> apksigner, so this
  recipe only supplies the platform. The F-Droid buildserver's SDK tops out at android-33,
  hence TARGET_SDK=33; the tree compiles against it unchanged while the GitHub release
  targets 36. SKIP_SIGN=1 leaves out/ztrackpad-lite-unsigned.apk for F-Droid to sign.

