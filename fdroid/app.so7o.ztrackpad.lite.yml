# Draft F-Droid metadata for app.so7o.ztrackpad.lite
#
# This file belongs in the fdroiddata repository at
#   metadata/app.so7o.ztrackpad.lite.yml
# It is kept here as a draft so the values live next to the app they describe. It is NOT read
# from this repo by F-Droid (only a self-hosted repo would read a .fdroid.yml here).
#
# Before submitting, confirm two things against the current fdroiddata docs and buildserver,
# because they are the parts of a hand-rolled build that F-Droid is pickiest about:
#
#   1. The platform jar: resolved. F-Droid's buildserver provisioning (fdroidserver's
#      buildserver/provision-android-sdk, master, last changed 2023-11) tops out at android-33.
#      build.sh takes TARGET_SDK and looks the platform up in ANDROID_HOME, and the tree was
#      verified to compile and package clean against platform 33 (targetSdkVersion 33), because
#      the code uses nothing newer. So this build does not depend on API 36 being present.
#   2. Reproducibility. F-Droid fails the build when the result is not reproducible. The zip
#      writer in build.sh already pins a fixed mtime, which is the usual source of a mismatch.
#
# Build with SKIP_SIGN=1 (added to build.sh) so the compile step does not ask for a keystore:
# F-Droid builds unsigned and signs with its own key.
#
# AuthorEmail is the author contact published on the F-Droid listing.

