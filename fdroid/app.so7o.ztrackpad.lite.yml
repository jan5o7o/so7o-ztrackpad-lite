Builds:
  - versionName: 0.3.0
    versionCode: 3
    commit: v0.3.0
    # TARGET_SDK=33 because the buildserver's SDK tops out there. Verified locally against the
    # platform-33 jar: the APK compiles and packages, at targetSdkVersion 33. If the buildserver
    # does ship API 36, drop TARGET_SDK=33 and the tree builds against 36 unchanged.
    build: TARGET_SDK=33 SKIP_SIGN=1 ./build.sh

